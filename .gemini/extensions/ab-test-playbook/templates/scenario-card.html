<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="generator" content="ab-test-playbook — https://github.com/ali-demirbas/ab-test-playbook">
<title>{{TITLE}}</title>
<style>
  :root{
    --teal:#08616b; --amber:#6b3804; --navy:#17086b;
    --body:rgba(0,0,0,.6); --ink:#111;
    --red:#e62d37;
    --brand:#ff6a00; --on-brand:#fff; --brand-name:"";
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink)}
  .card{width:1600px;min-height:900px;display:flex;gap:36px;padding:44px;background:#fff}
  /* sol sütun: mockup çifti + altında alt bilgi (metin sütunu daha uzun olduğunda boş kalan yeri kullanır) */
  .left{flex:0 0 54%;min-width:0;display:flex;flex-direction:column;gap:16px}

  /* ---- sol: mockup çifti ---- */
  .mockups{flex:1 0 auto;min-width:0;display:flex;gap:28px;background:#f4f4f5;border-radius:28px;padding:56px 28px 28px;position:relative}
  .variant{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative}
  .pill{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#5cf679;color:#0b3512;font-weight:700;font-size:15px;
        padding:7px 20px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
  .phone{width:300px;max-width:100%;height:640px;background:#fff;border-radius:32px;box-shadow:0 16px 50px rgba(12,12,13,.10);
         padding:14px 14px 0;display:flex;flex-direction:column;overflow:hidden;position:relative;margin-top:14px}
  .statusbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#111;padding:2px 6px 10px}
  .sb-icons{display:flex;align-items:center;gap:5px}
  .sig{display:inline-block;width:15px;height:9px;background:#111;clip-path:polygon(0 100%,100% 0,100% 100%)}
  .batt{display:inline-block;position:relative;width:21px;height:10px;border:1.5px solid #111;border-radius:3px;padding:1px}
  .batt::before{content:"";display:block;width:72%;height:100%;background:#111;border-radius:1px}
  .batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:3.5px;background:#111;border-radius:0 1px 1px 0}
  /* mobil tarayıcı adres çubuğu (device: phone-web) */
  .m-addr{display:flex;align-items:center;justify-content:center;gap:5px;height:26px;margin:0 2px 10px;border-radius:9px;
          background:#efeff1;font-size:10.5px;color:#3a3a40;flex:0 0 auto}
  .lock{display:inline-block;position:relative;width:7px;height:6px;background:#55555c;border-radius:1.5px;margin-top:3px}
  .lock::before{content:"";position:absolute;left:1px;top:-4px;width:5px;height:5px;border:1.3px solid #55555c;border-bottom:0;border-radius:3px 3px 0 0;box-sizing:border-box}
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;position:relative}
  .ph{background:#e7e7ea;border-radius:8px}
  .ph.img{height:120px;background:#dfe6ef}
  .ph.hero{background:linear-gradient(135deg,#1d2b3a,#3b4f63);color:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .ph.hero .r-h,.ph.hero .r-name,.ph.hero .r-price{color:#fff}
  .ph.hero .r-sub,.ph.hero .r-meta,.ph.hero .r-help{color:rgba(255,255,255,.82)}
  .bottomnav{display:flex;justify-content:space-around;border-top:1px solid #ececee;padding:10px 0 12px;margin-top:auto}
  .bottomnav span{font-size:9px;color:#70707a}
  .bottomnav span.on{color:var(--brand);font-weight:700}

  /* ---- değişen öğe işareti ----
     .hl değişen öğenin etrafına çizilir. Halka outline ile çizilir: kutu modeline
     yer kaplamaz, bu yüzden halkalı ve halkasız varyant aynı hizada kalır.
     Etiket halkanın dışına, sağ üst köşeye oturur; altta yer varsa data-pos="below". */
  .hl{position:relative;border-radius:10px;outline:3px solid var(--red);outline-offset:4px;box-shadow:0 0 14px 3px rgba(230,45,55,.28)}
  .hl[data-note]::after{content:attr(data-note);position:absolute;right:-7px;bottom:calc(100% + 7px);z-index:3;
      background:var(--red);color:#fff;font-size:10.5px;font-weight:700;line-height:1;
      padding:3px 7px;border-radius:5px;white-space:nowrap}
  .hl[data-pos="below"]::after,.card[data-note-pos="below"] .hl:not([data-pos="above"])::after{bottom:auto;top:calc(100% + 7px)}
  /* Mockup'ın altındaki tek satırlık not (kaldırma testinde B'de içeriğin yukarı kaydığı).
     Ekranın İÇİNE değil, telefonun/tarayıcının ALTINA konur; build_card shift_note_a/b'den üretir. */
  .shift-note{font-size:11.5px;color:#5a5a60;font-style:italic;text-align:center;margin-top:10px;max-width:100%}

  /* ---- web/masaüstü mockup (device: web) ---- */
  .browser{width:100%;max-width:560px;height:600px;background:#fff;border-radius:16px;box-shadow:0 16px 50px rgba(12,12,13,.10);
            display:flex;flex-direction:column;overflow:hidden;position:relative;margin-top:14px}
  .browser-bar{height:36px;background:#e8e8ea;display:flex;align-items:center;padding:0 14px;gap:6px;flex:0 0 auto}
  .browser-dot{width:9px;height:9px;border-radius:50%;background:#d0d0d3}
  .browser-url{flex:1;min-width:0;height:20px;background:#fff;border-radius:10px;margin-left:8px;overflow:hidden;white-space:nowrap;
               display:flex;align-items:center;padding:0 10px;font-size:10px;color:#70707a}
  .browser-screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:16px;position:relative}
  /* Web kartında mockup'lar genişler, metin sütunu sabit 580px kalır ve yazı biraz sıkılaşır:
     iki masaüstü çerçeve yan yana sığar, kart yatay kalır, metin okunur. */
  .card[data-device="web"] .left{flex:1 1 auto}
  .card[data-device="web"] .mockups{padding:56px 20px 22px;gap:20px}
  .card[data-device="web"] .copy{flex:0 0 580px;gap:16px}
  .card[data-device="web"] h1{font-size:31px}
  .card[data-device="web"] .desc{font-size:15px;line-height:1.45}
  .card[data-device="web"] .box header{font-size:17px;padding:10px 20px}
  .card[data-device="web"] .box ul{gap:5px;padding:12px 20px 14px}
  .card[data-device="web"] .box li{font-size:14px;line-height:1.38}

  /* ---- GERÇEKÇİ İÇERİK BİLEŞENLERİ ----
     Kartlar tam gerçekçi seviyede üretilir (mockup-style.md → Gerçekçilik seviyesi):
     metin, fiyat ve etiketler gerçek yazılır, gri kutu kullanılmaz.
     .ph.* blokları yalnızca FOTOĞRAF yerine kullanılır (ürün görseli, avatar, hero arka planı). */
  .r-h{font-size:13px;font-weight:700;color:#111;margin:2px 0 4px}
  .r-sub{font-size:11px;color:#6a6a70}
  .r-row{display:flex;gap:8px;align-items:flex-end}
  .r-row>*{flex:1;min-width:0}
  .r-card{border:1px solid #e4e4e8;border-radius:10px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px}
  .r-item{display:flex;gap:9px;align-items:center}
  .r-thumb,.ph.img.r-thumb{width:42px;height:42px;border-radius:7px;background:#dfe6ef;flex:0 0 auto}
  .r-item-body{flex:1;min-width:0}
  .r-name{font-size:12px;color:#111;font-weight:600}
  .r-meta{font-size:10.5px;color:#70707a;margin-top:1px}
  .r-price{font-size:13px;font-weight:700;color:#111;white-space:nowrap}
  .r-old{font-size:11px;color:#8a8a90;text-decoration:line-through;margin-right:5px}
  .r-now{font-size:14px;font-weight:800;color:#111}
  .r-per{font-size:10.5px;color:#70707a;margin-left:2px}
  .r-label{font-size:10.5px;color:#6a6a70;margin-bottom:3px}
  .r-field{border:1px solid #dcdce0;border-radius:7px;padding:8px 10px;font-size:11.5px;color:#111;background:#fff;position:relative;min-height:32px}
  .r-field.empty{color:#70707a}
  .r-field.select{padding-right:24px}
  .r-field.select::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-5px;
      border-right:1.5px solid #55555c;border-bottom:1.5px solid #55555c;transform:rotate(45deg)}
  .r-help{font-size:10px;color:#70707a;margin-top:3px}
  .r-info{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:#24466e;background:#eef4fb;border-radius:7px;padding:7px 9px}
  .r-info::before{content:"i";flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:#24466e;color:#fff;font-size:9px;font-weight:700;
      font-style:italic;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .r-link{font-size:11.5px;color:#1b62d6;font-weight:600}
  .r-line{display:flex;justify-content:space-between;font-size:11.5px;color:#5a5a60;padding:2px 0}
  .r-line.total{font-size:13px;font-weight:700;color:#111;border-top:1px solid #ececee;margin-top:4px;padding-top:7px}
  .r-cta{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;text-align:center;
         padding:12px;border-radius:10px;border:1.5px solid var(--brand)}
  .r-cta.outline{background:#fff;color:var(--brand)}
  .r-cta.ghost{background:#fff;color:#111;border-color:#111}
  .r-cta.sm{font-size:11.5px;padding:7px 10px;border-radius:8px}
  .r-header{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #ececee;font-size:10.5px;color:#3a3a40}
  .r-header.filled{background:var(--brand);color:var(--on-brand);border-bottom:0;border-radius:8px}
  .r-logo{font-size:13px;font-weight:800;color:var(--brand);white-space:nowrap}
  .r-logo:empty::before{content:var(--brand-name)}
  .r-header.filled .r-logo{color:var(--on-brand)}
  .r-nav{display:flex;gap:10px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
  .r-tel{font-weight:700;white-space:nowrap;margin-left:auto}
  .r-tabs{display:flex;gap:2px;border-bottom:1px solid #e4e4e8}
  .r-tabs span{font-size:11px;color:#6a6a70;padding:7px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .r-tabs span.on{color:#111;font-weight:700;border-bottom-color:var(--brand)}
  .r-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .r-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .r-tile{border:1px solid #e4e4e8;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:5px;background:#fff}
  .r-plan{border:1px solid #e4e4e8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
  .r-plan.featured{border:2px solid var(--brand)}
  .r-plan-name{font-size:12px;font-weight:700;color:#111}
  .r-plan-price{font-size:20px;font-weight:800;color:#111}
  .r-plan-feat{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:#4a4a50}
  .r-plan-feat li::before{content:"✓ ";color:#1c7a34;font-weight:700}
  .r-steps{display:flex;gap:4px;font-size:9.5px;color:#8a8a90}
  .r-steps span{flex:1;min-width:0;border-top:3px solid #e4e4e8;padding-top:4px;white-space:nowrap;overflow:hidden}
  .r-steps span.done{border-top-color:#9ec9a6;color:#4a4a50}
  .r-steps span.on{border-top-color:var(--brand);color:#111;font-weight:700}
  .r-progress{height:6px;border-radius:3px;background:#e4e4e8;overflow:hidden}
  .r-progress>i{display:block;height:100%;background:var(--brand)}
  .r-check,.r-radio{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:#3a3a40}
  .r-check::before,.r-radio::before{content:"";flex:0 0 auto;width:13px;height:13px;border:1.5px solid #9a9aa2;background:#fff;margin-top:1px}
  .r-check::before{border-radius:3px}
  .r-radio::before{border-radius:50%}
  .r-check.on::before{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 2px #fff}
  .r-radio.on::before{border-color:var(--brand);box-shadow:inset 0 0 0 3px #fff;background:var(--brand)}
  .r-chips{display:flex;flex-wrap:wrap;gap:6px}
  .r-chip{font-size:10.5px;color:#3a3a40;border:1px solid #dcdce0;border-radius:999px;padding:4px 9px;background:#fff;white-space:nowrap}
  .r-chip.on{border-color:var(--brand);color:var(--brand);font-weight:700}
  .r-search{position:relative;border:1px solid #dcdce0;border-radius:999px;padding:8px 12px 8px 30px;font-size:11.5px;color:#70707a;background:#fff}
  .r-search::before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;margin-top:-6px;border:1.5px solid #70707a;border-radius:50%}
  .r-search::after{content:"";position:absolute;left:19px;top:50%;width:5px;height:1.5px;margin-top:3px;background:#70707a;transform:rotate(45deg)}
  .r-suggest{border:1px solid #e4e4e8;border-radius:10px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;margin-top:-6px}
  .r-suggest>*{font-size:11px;color:#3a3a40;padding:7px 12px;border-top:1px solid #f0f0f2}
  .r-suggest>*:first-child{border-top:0}
  .r-overlay{position:absolute;inset:0;z-index:2;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:14px}
  .r-modal{background:#fff;border-radius:12px;padding:14px;width:100%;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .r-banner{background:var(--brand);color:var(--on-brand);font-size:10.5px;font-weight:600;padding:7px 10px;border-radius:8px}
  .r-badge{display:inline-block;background:#eaf7ec;color:#1c7a34;font-size:10px;font-weight:700;
           padding:3px 8px;border-radius:999px}
  .r-badge.warn{background:#fff3e6;color:#a55600}
  .r-badge.brand{background:var(--brand);color:var(--on-brand)}
  .r-stars{font-size:11px;color:#b06f00;letter-spacing:1px}
  .r-divider{height:1px;background:#ececee;margin:2px 0}

  /* ---- sağ: metin sütunu ---- */
  .copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
  h1{font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
  .desc{font-size:17px;line-height:1.5;color:#3a3a3f}
  .box{border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.05);border:1px solid #ededf0;overflow:hidden}
  .box header{padding:12px 20px;font-size:19px;font-weight:800}
  .box.test header{background:linear-gradient(90deg,#a5f6ff,#cbf9ff);color:var(--teal)}
  .box.kpi  header{background:linear-gradient(90deg,#ffe3a5,#ffe5cb);color:var(--amber)}
  .box.dont header{background:linear-gradient(90deg,#d9cfff,#e9dcff);color:var(--navy)}
  .box ul{list-style:none;padding:14px 22px 18px;display:flex;flex-direction:column;gap:7px}
  .box li{font-size:15.5px;line-height:1.4;color:var(--body);padding-left:16px;position:relative}
  .box li::before{content:"•";position:absolute;left:0;color:var(--body)}
  .box li b{color:rgba(0,0,0,.78)}
  .role{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:3px 8px;border-radius:999px;vertical-align:2px;margin-right:5px;white-space:nowrap}
  .role-primary{background:var(--amber);color:#fff}
  .role-guardrail{background:#fde2e1;color:#9b1c1c}
  .role-secondary{background:#ececef;color:#55555c}

  /* ---- alt bilgi (sol sütunda, mockup'ların altında): etiketler, marka notu, mockup açıklaması ---- */
  .card-foot{padding:0 6px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.45;color:#5a5a60}
  .card-foot .tags{display:flex;flex-wrap:wrap;gap:4px 18px;color:#3a3a3f}
  .card-foot .tags b{color:#111}
{{BRAND_CSS}}
</style>
</head>
<body>
<div class="card" data-device="{{DEVICE}}" data-note-pos="{{NOTE_POS}}">
  <!-- Bu yorum yalnızca şablonu okuyan için; build_card.py teslim edilen karttan siler.

       KARTI ELLE DOLDURMA. Senaryo tek bir JSON'dur (templates/scenario.schema.json);
       scripts/build_card.py yerleştiricileri doldurur, metni kaçırır, cihaz çerçevesini seçer:
         device: phone      → telefon çerçevesi + durum çubuğu; sekme çubuğu YALNIZCA card.bottom_nav ile (yerel uygulama),
                              ekranın ait olduğu sekme card.bottom_nav_active ile (sekmenin adı ya da 0 tabanlı sırası)
         device: phone-web  → telefon çerçevesi + durum çubuğu + mobil adres çubuğu (kilit + card.url'deki alan adı), sekme çubuğu yok
         device: web        → tarayıcı çerçevesi (üç nokta + adres çubuğu), mockup'lar geniş, metin sütunu 580px

       DEĞİŞEN ÖĞE (.hl) ve card.difference:
         change → halka B'de (A'da isteğe bağlı)      add  → halka yalnızca B'deki yeni öğede
         move   → halka hem A'da hem B'de             remove → halka yalnızca A'da, B'de alan gerçekten boş + card.shift_note_b
       Aynı değişiklik tekrarlanan N öğeye uygulanıyorsa (altı kartın altı butonu) N halka değil,
       grubun etrafına TEK halka çizilir: <div class="hl" data-note="butonlar dolu"> …altı kart… </div>
       Etiket bir öğeyi örtüyorsa: data-pos="below" (tek halka) ya da card.note_pos: "below" (tüm kart).

       BİLEŞENLER (yalnızca CSS; işaretleme örnekleri):
         Başlık çubuğu   <div class="r-header"><span class="r-logo">Marka</span><span class="r-nav"><span>Ürünler</span><span>Kampanyalar</span></span><span class="r-tel">0850 000 00 00</span></div>
                         .r-header.filled marka renginde dolu; boş <span class="r-logo"></span> card.brand.name'i yazar
         Sekmeler        <div class="r-tabs"><span class="on">Kredi</span><span>Mevduat</span></div>
         Alan            <div class="r-label">Ad Soyad</div><div class="r-field empty">Adınızı yazın</div>
         Açılır liste    <div class="r-field select">30-65</div>
         Yan yana alan   <div class="r-row"><div>…</div><div>…</div></div>
         Butonlar        .r-cta (dolu, marka rengi) · .r-cta.outline (çerçeveli) · .r-cta.ghost (siyah çerçeve) · .sm (küçük)
         Ürün ızgarası   <div class="r-grid c3"><div class="r-tile"><div class="r-name">Kasko</div><div class="r-meta">…</div><div class="r-cta sm outline">Teklif al</div></div>…</div>
         Plan kartı      <div class="r-plan featured"><div class="r-plan-name">Pro</div><div class="r-plan-price">499 TL<span class="r-per">/ay</span></div><ul class="r-plan-feat"><li>…</li></ul></div>
         Adımlar         <div class="r-steps"><span class="done">Araç</span><span class="on">Kişi</span><span>Teklif</span></div> · <div class="r-progress"><i style="width:40%"></i></div>
         Onay kutusu     <div class="r-check on">…</div> · Seçim düğmesi <div class="r-radio">…</div>
         Bilgi satırı    <div class="r-info">…</div> · Yardım satırı <div class="r-help">…</div>
         Çipler          <div class="r-chips"><span class="r-chip on">3 gün</span><span class="r-chip">1 hafta</span></div>
         Açılır pencere  <div class="r-overlay"><div class="r-modal">…</div></div> (ekranın üstünü kaplar)
         Arama           <div class="r-search">Nereye gidiyorsun?</div><div class="r-suggest"><div>Antalya</div><div>İzmir</div></div>
         Fotoğraflı hero <div class="ph hero"><div class="r-h">Başlık</div><div class="r-sub">…</div></div> (koyu zemin, beyaz metin)
         Kampanya şeridi <div class="r-banner">4 taksit imkânı</div> (marka renginde dolu şerit)
         Rozet, fiyat    .r-badge (.warn, .brand) · <span class="r-old">1.200 TL</span><span class="r-now">990 TL</span><span class="r-per">/ay</span>
         Kalemler        .r-item/.r-thumb/.r-item-body/.r-name/.r-meta/.r-price · .r-line, .r-line.total · .r-card · .r-divider · .r-stars · .r-link

       İŞARETLEME İZİN LİSTESİYLE SINIRLIDIR; build_card.py listede olmayanı temizlemez, kartı reddeder:
         etiketler  div span p b strong i em u s small sup sub br hr ul ol li
         nitelikler class style data-note data-pos title role aria-*  (her değer çift tırnak içinde)
         yok        yorum, bağlantı (href), görsel/kaynak (src), form, betik, olay işleyici (on…=), style içinde url(), dış stil içe aktarma, position:fixed
         .hl sarmalayıcısı satır içi margin ya da padding taşımaz (halka içeriği itmez); r-… sınıfları yalnızca burada tanımlı olanlardır.

       İÇERİK GERÇEK YAZILIR (mockup-style.md → Gerçekçilik seviyesi). Alanlara girilmiş kişisel veri
       (ad, e-posta, telefon, kimlik/kart numarası) asla taşınmaz; alan boş varsayılan hâliyle çizilir. -->
  <div class="left">
  <div class="mockups">
    <div class="variant">
      <span class="pill">Variant A</span>
      <div class="phone">
        <div class="statusbar"><span>12:41</span><span class="sb-icons"><span class="sig"></span><span class="batt"></span></span></div>
        <div class="screen">
          {{VARIANT_A_SCREEN}}
        </div>
        <div class="bottomnav"><span>Anasayfa</span><span>Keşfet</span><span>Favoriler</span><span>Sepet</span><span>Profil</span></div>
      </div>
      {{SHIFT_NOTE_A}}
    </div>
    <div class="variant">
      <span class="pill">Variant B</span>
      <div class="phone">
        <div class="statusbar"><span>12:41</span><span class="sb-icons"><span class="sig"></span><span class="batt"></span></span></div>
        <div class="screen">
          {{VARIANT_B_SCREEN}}
        </div>
        <div class="bottomnav"><span>Anasayfa</span><span>Keşfet</span><span>Favoriler</span><span>Sepet</span><span>Profil</span></div>
      </div>
      {{SHIFT_NOTE_B}}
    </div>
  </div>
  {{FOOTER}}
  </div>

  <div class="copy">
    <h1>{{TITLE}}</h1>
    <p class="desc">{{DESC}}</p>

    <div class="box test">
      <header>{{H_TEST}}</header>
      <ul>
        {{TEST_ITEMS}}

    </div>

    <div class="box kpi">
      <header>{{H_KPI}}</header>

    </div>

    <div class="box dont">
      <header>{{H_DONT}}</header>

</div>
