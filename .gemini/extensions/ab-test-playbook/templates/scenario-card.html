<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="generator" content="ab-test-playbook — https://github.com/ali-demirbas/ab-test-playbook">
<title>{{TITLE}}</title>
<style>
  :root{
    --text:#111827; --text-2:#374151; --muted:#6b7280;
    --line:#e5e7eb; --line-2:#d1d5db; --surface:#ffffff; --surface-2:#f9fafb;
    --link:#2563eb; --success:#15803d; --warning:#b45309; --ring:#e11d48;
    --brand:#1f2937; --on-brand:#ffffff; --brand-name:"";
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#f4f5f7}
  body{font-family:-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
       -webkit-font-smoothing:antialiased}

  /* ---- kart: 1600 × 900, başlık + iki sütun ---- */
  .card{position:relative;width:1600px;height:900px;overflow:hidden;padding:40px 48px;background:#f4f5f7;
        display:flex;flex-direction:column;gap:28px}
  .title{flex:0 0 auto;font-size:30px;line-height:1.25;font-weight:650;letter-spacing:-.01em;color:#111827}
  /* Sahne başlığın altındaki alanın tamamı; iki sütun tek satırdır, satır içerik kadar uzun (en fazla
     sahne) ve sahnede dikey ortalanır: A ile B hep aynı y'de başlar, kısa ekranda boşluk alta yığılmaz. */
  .stage{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
         grid-template-rows:minmax(0,max-content);align-content:center;column-gap:48px}
  .variant{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:14px}
  .pill{flex:0 0 auto;font-size:14px;font-weight:600;line-height:1;padding:7px 16px;border-radius:999px;white-space:nowrap}
  /* İki hap aynı biçimdedir, yalnızca metin farklı: hiçbir kolda kazanan rengi yok. */
  .pill-a,.pill-b{background:#ffffff;border:1px solid #d1d5db;color:#111827}

  /* ---- telefon çerçevesi (device: phone, phone-web): ekran 420px, yükseklik = içerik ----
     zoom:1.2 çerçeveyi bütün olarak 504px'e büyütür (oranlar korunur): telefon sütunun ~%70'ini kaplar,
     değişken kolay okunur. İçerik en fazla ~590px (ölçeklenmiş ~710px) olabilir; aşarsa render_check hata verir. */
  .phone{zoom:1.2;--fs:15px;--fs-sm:13px;--fs-ctl:14px;--fs-h:19px;--fs-lg:17px;--fs-xl:26px;--tap:44px;--tap-sm:44px;
         flex:0 1 auto;min-height:0;width:420px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;
         background:#ffffff;border:1px solid #d1d5db;border-radius:36px;
         box-shadow:0 1px 2px rgba(17,24,39,.05),0 12px 32px rgba(17,24,39,.08)}
  /* card.phone_scale: 1 → çerçeve büyütülmez (420px): uzun bir form ya da ekran sahneye sığsın diye; varsayılan 1.2;
     1.4 → kısa bir ekran sahnenin çoğunu boş bırakmasın diye büyütülür. Devam yaprağı (.below) aynı ölçekle çizilir. */
  .card[data-phone-scale="1"] .phone{zoom:1}
  .card[data-phone-scale="1.4"] .phone{zoom:1.4}
  .statusbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 30px 10px;
             font-size:14px;font-weight:600;line-height:1;color:#111827}
  .sb-icons{display:flex;align-items:center;gap:6px}
  .sig{display:inline-block;width:17px;height:11px;background:#111827;clip-path:polygon(0 100%,100% 0,100% 100%)}
  .batt{display:inline-block;position:relative;width:25px;height:12px;border:1.5px solid #111827;border-radius:4px;padding:1.5px}
  .batt::before{content:"";display:block;width:75%;height:100%;background:#111827;border-radius:1.5px}
  .batt::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:#111827;border-radius:0 1px 1px 0}
  /* mobil tarayıcı adres çubuğu (device: phone-web) */
  .m-addr{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;height:36px;margin:2px 16px 6px;
          border-radius:12px;background:#f3f4f6;font-size:13px;color:#374151}
  .lock{display:inline-block;position:relative;width:9px;height:7px;background:#4b5563;border-radius:1.5px;margin-top:4px}
  .lock::before{content:"";position:absolute;left:1.5px;top:-5px;width:6px;height:6px;border:1.5px solid #4b5563;border-bottom:0;
                border-radius:3px 3px 0 0;box-sizing:border-box}
  .screen{flex:0 1 auto;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:16px;
          padding:14px 20px 20px;font-size:var(--fs);line-height:1.4;color:#111827}
  /* Ekrandaki bloklar sığmayınca ezilmez, taşar (ve kesilir): taşma görünür kalır, render_check onu ölçer. */
  .screen>*,.browser-screen>*{flex-shrink:0}
  .bottomnav{flex:0 0 auto;display:flex;justify-content:space-around;border-top:1px solid #e5e7eb;padding:12px 8px 18px}
  .bottomnav span{font-size:12px;font-weight:500;color:#6b7280}
  .bottomnav span.on{color:var(--brand);font-weight:700}
  /* mobil tarayıcının alt araç çubuğu (card.mobile_toolbar, phone-web): iki kolda aynı, içerik değil çerçeve */
  .m-toolbar{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid #e5e7eb;background:#f9fafb}
  .mt-row{display:flex;justify-content:space-around;align-items:center;height:44px;padding:0 24px}
  .mt-row>span{position:relative;display:block;width:24px;height:24px}
  .mt-back::before,.mt-fwd::before{content:"";position:absolute;top:7px;width:9px;height:9px;border-bottom:2px solid #4b5563}
  .mt-back::before{left:8px;border-left:2px solid #4b5563;transform:rotate(45deg)}
  .mt-fwd::before{left:5px;border-right:2px solid #4b5563;transform:rotate(-45deg)}
  .mt-share::before{content:"";position:absolute;left:5px;top:9px;width:14px;height:12px;border:2px solid #4b5563;
      border-top:0;border-radius:0 0 3px 3px}
  .mt-share::after{content:"";position:absolute;left:11px;top:2px;width:2px;height:13px;background:#4b5563}
  .mt-tabs::before,.mt-tabs::after{content:"";position:absolute;width:12px;height:12px;border:2px solid #4b5563;border-radius:3px}
  .mt-tabs::before{left:4px;top:8px}
  .mt-tabs::after{left:8px;top:4px;background:#f9fafb}
  .m-home{display:flex;justify-content:center;align-items:center;height:22px}
  .m-home>span{display:block;width:120px;height:5px;border-radius:3px;background:#111827}

  /* ---- tarayıcı çerçevesi (device: web): sütun genişliği, yükseklik = içerik ---- */
  .browser{--fs:14px;--fs-sm:13px;--fs-ctl:14px;--fs-h:18px;--fs-lg:16px;--fs-xl:24px;--tap:40px;--tap-sm:34px;
           flex:0 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;overflow:hidden;
           background:#ffffff;border:1px solid #d1d5db;border-radius:14px;
           box-shadow:0 1px 2px rgba(17,24,39,.05),0 12px 32px rgba(17,24,39,.08)}
  .browser-bar{flex:0 0 auto;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#f3f4f6;
               border-bottom:1px solid #e5e7eb}
  .browser-dot{width:11px;height:11px;border-radius:50%;background:#d1d5db}
  .browser-url{flex:1;min-width:0;height:28px;margin-left:10px;display:flex;align-items:center;gap:7px;padding:0 12px;
               background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;color:#374151;
               white-space:nowrap;overflow:hidden}
  .browser-screen{flex:0 1 auto;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:16px;
                  padding:20px 24px 24px;font-size:var(--fs);line-height:1.45;color:#111827}

  /* ---- değişen öğe işareti ----
     Halka outline ile çizilir: yer kaplamaz, halkalı ve halkasız varyant aynı hizada kalır.
     Parıltı ve dolgu yok. Etiket halkanın dışında, sağ üst köşesine oturur; data-pos="below"
     (tek halka) ya da card.note_pos (tüm kart) onu alta alır. */
  .hl{position:relative;border-radius:10px;outline:3px solid var(--ring);outline-offset:4px}
  .hl[data-note]::after{content:attr(data-note);position:absolute;right:-7px;bottom:calc(100% + 4px);z-index:3;
      background:var(--ring);color:#ffffff;font-size:12.5px;font-weight:600;line-height:1;letter-spacing:0;
      padding:4px 9px;border-radius:999px;white-space:nowrap}
  .hl[data-pos="below"]::after,.card[data-note-pos="below"] .hl:not([data-pos="above"])::after{bottom:auto;top:calc(100% + 4px)}
  /* Yumuşak halka (.hl-soft): değişkenin bağlı sonucu, daha az vurgulu; etiketi beyaz zeminli çerçeveli hap. */
  .hl-soft{position:relative;border-radius:10px;outline:2px dashed var(--ring);outline-offset:4px}
  .hl-soft[data-note]::after{content:attr(data-note);position:absolute;right:-6px;bottom:calc(100% + 4px);z-index:3;
      background:#ffffff;color:var(--ring);border:1px solid var(--ring);font-size:12px;font-weight:600;line-height:1;
      padding:3px 8px;border-radius:999px;white-space:nowrap}
  .hl-soft[data-pos="below"]::after,.card[data-note-pos="below"] .hl-soft:not([data-pos="above"])::after{bottom:auto;
      top:calc(100% + 4px)}

  /* ---- ilk ekran, sabit bar, devam yaprağı (phone, phone-web) ----
     .r-fold ekranı böler: öncesi telefonda ilk ekran, sonrası telefonun altında devam yaprağı (.below).
     .r-sticky ilk ekranın alt kenarına sabit bardır; bir kolda bar varsa iki kolun ilk ekranı da barın
     yüksekliği kadar alt boşluk bırakır (.has-sticky), bar içeriği örtmez ve A ile B aynı hizada kalır.
     Devam yaprağı varken telefon ezilmez (ilk ekran iki kolda aynı kalır); sahneye sığmayan yaprak kesilir
     ve render_check bunu hata sayar: phone_scale 1 ya da daha kısa içerik. */
  .r-fold,.r-stage-break{display:none}
  .screen.has-sticky{padding-bottom:calc(var(--tap) + 56px)}
  .r-sticky{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:10px 20px;background:var(--surface);
            border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(17,24,39,.06)}
  .card .screen .r-sticky .hl[data-note]::after{top:auto;bottom:calc(100% + 17px)}
  .phone:has(+ .below){flex-shrink:0}
  .below{zoom:1.2;--fs:15px;--fs-sm:13px;--fs-ctl:14px;--fs-h:19px;--fs-lg:17px;--fs-xl:26px;--tap:44px;--tap-sm:44px;
         flex:0 1 auto;min-height:0;width:418px;max-width:100%;display:flex;flex-direction:column;gap:6px}
  .card[data-phone-scale="1"] .below{zoom:1}
  .card[data-phone-scale="1.4"] .below{zoom:1.4}
  .below-cap{flex:0 0 auto;font-size:13px;font-weight:500;line-height:1.3;color:#4b5563;padding-left:2px}
  .below-screen{flex:0 1 auto;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:16px;
                padding:14px 19px 20px;background:#ffffff;border:1px solid #e5e7eb;border-radius:0 0 14px 14px;
                font-size:var(--fs);line-height:1.4;color:#111827}
  .below-screen>*{flex-shrink:0}

  /* ---- aşamalar (.r-stage-break + card.stage_captions): her aşama kendi küçük telefonunda, soldan sağa ----
     Aşama telefonu sabit 0.8 ölçekle çizilir (iki telefon 728px sütuna 16px aralıkla sığar); metin
     ölçeklenince de 12px'in altına inmesin diye taban ölçüler büyütülür. */
  .stages{flex:0 1 auto;min-height:0;max-width:100%;display:flex;align-items:flex-start;justify-content:center;gap:16px}
  .stage-col{flex:0 0 auto;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .stage-cap{font-size:14px;font-weight:600;line-height:1.3;color:#374151;text-align:center;max-width:336px}
  .stage-arrow{align-self:center;font-size:22px;line-height:1;color:#6b7280}
  .card .stage-col>.phone{zoom:.8;--fs:16px;--fs-sm:15px;--fs-ctl:15px;--fs-h:20px;--fs-lg:18px;--fs-xl:26px}
  .stage-col .statusbar,.stage-col .m-addr,.stage-col .bottomnav span,.stage-col .r-steps,.stage-col .r-badge,
  .stage-col .hl[data-note]::after,.stage-col .hl-soft[data-note]::after{font-size:15px}
  .stage-col .r-info::before{width:19px;height:19px;line-height:19px;font-size:15px}

  /* ---- GERÇEKÇİ İÇERİK BİLEŞENLERİ ----
     Boyutlar çizildikleri boyuttur (ölçekleme yok). Çerçeve taban ölçüyü verir: --fs telefonda 15px,
     web'de 14px; başlık 18-19px, yardım/meta 13px, hiçbir metin 12px'in altında değil; telefonda buton
     ve alan en az 44px. .ph blokları yalnızca FOTOĞRAF yerine kullanılır. */
  .ph{background:#e5e7eb;border-radius:10px}
  .ph.img{height:150px}
  .ph.hero{background:linear-gradient(135deg,#1f2937,#374151);color:#ffffff;border-radius:12px;padding:18px;
           display:flex;flex-direction:column;gap:8px}
  .ph.hero .r-h,.ph.hero .r-name,.ph.hero .r-price,.ph.hero .r-now{color:#ffffff}
  .ph.hero .r-sub,.ph.hero .r-meta,.ph.hero .r-help{color:rgba(255,255,255,.88)}
  .r-h{font-size:var(--fs-h);font-weight:600;line-height:1.3;color:#111827}
  .r-sub{font-size:var(--fs-sm);line-height:1.45;color:#6b7280}
  .r-row{display:flex;gap:12px;align-items:flex-end}
  .r-row>*{flex:1;min-width:0}
  .r-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#ffffff;display:flex;flex-direction:column;gap:10px}
  .r-item{display:flex;gap:12px;align-items:center}
  .r-thumb,.ph.img.r-thumb{width:52px;height:52px;border-radius:8px;background:#e5e7eb;flex:0 0 auto}
  .r-item-body{flex:1;min-width:0}
  .r-name{font-size:var(--fs);font-weight:600;color:#111827}
  .r-meta{font-size:var(--fs-sm);color:#6b7280;margin-top:2px}
  .r-price{font-size:var(--fs);font-weight:600;color:#111827;white-space:nowrap}
  .r-old{font-size:var(--fs-sm);color:#6b7280;text-decoration:line-through;margin-right:6px}
  .r-now{font-size:var(--fs-lg);font-weight:700;color:#111827}
  .r-per{font-size:var(--fs-sm);font-weight:400;color:#6b7280;margin-left:2px}
  .r-label{font-size:var(--fs-sm);font-weight:500;color:#374151;margin-bottom:6px}
  .r-field{position:relative;display:flex;align-items:center;min-height:var(--tap);padding:0 12px;border:1px solid #d1d5db;
           border-radius:8px;background:#ffffff;font-size:var(--fs);color:#111827}
  .r-field.empty{color:#6b7280}
  .r-field.select{padding-right:34px}
  .r-field.select::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-6px;
      border-right:1.5px solid #4b5563;border-bottom:1.5px solid #4b5563;transform:rotate(45deg)}
  .r-help{font-size:var(--fs-sm);color:#6b7280;margin-top:6px}
  .r-info{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-sm);line-height:1.45;color:#1e3a8a;background:#eff6ff;
          border-radius:8px;padding:10px 12px}
  .r-info::before{content:"i";flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:#1e3a8a;color:#ffffff;
      font-size:12px;font-weight:700;font-style:italic;line-height:16px;text-align:center;margin-top:1px}
  .r-link{font-size:var(--fs);font-weight:600;color:var(--link)}
  .r-line{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs);color:#374151}
  .r-line.total{font-size:var(--fs-lg);font-weight:700;color:#111827;border-top:1px solid #e5e7eb;padding-top:12px}
  .r-cta{display:flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 18px;border-radius:10px;
         border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);font-size:var(--fs);font-weight:600;
         text-align:center}
  .r-cta.outline{background:#ffffff;color:var(--brand)}
  .r-cta.ghost{background:#ffffff;color:#111827;border-color:#111827}
  .r-cta.sm{min-height:var(--tap-sm);padding:0 12px;border-radius:8px;font-size:var(--fs-sm)}
  .r-header{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:var(--fs-sm);
            color:#374151}
  .r-header.filled{background:var(--brand);color:var(--on-brand);border-bottom:0;border-radius:10px;padding:10px 12px}
  .r-logo{font-size:var(--fs-lg);font-weight:700;color:var(--brand);white-space:nowrap}
  .r-logo:empty::before{content:var(--brand-name)}
  .r-header.filled .r-logo{color:var(--on-brand)}
  .r-nav{display:flex;gap:14px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
  .r-tel{font-weight:600;white-space:nowrap;margin-left:auto}
  .r-tabs{display:flex;border-bottom:1px solid #e5e7eb}
  .r-tabs span{font-size:var(--fs-ctl);color:#6b7280;padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;
               white-space:nowrap}
  .r-tabs span.on{color:#111827;font-weight:600;border-bottom-color:var(--brand)}
  .r-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .r-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .r-tile{border:1px solid #e5e7eb;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#ffffff}
  .r-plan{border:1px solid #e5e7eb;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#ffffff}
  .r-plan.featured{border:2px solid var(--brand)}
  .r-plan-name{font-size:var(--fs);font-weight:600;color:#111827}
  .r-plan-price{font-size:var(--fs-xl);font-weight:700;line-height:1.2;color:#111827}
  .r-plan-feat{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);color:#374151}
  .r-plan-feat li::before{content:"✓ ";color:var(--success);font-weight:700}
  .r-steps{display:flex;gap:6px;font-size:12px;color:#6b7280}
  .r-steps span{flex:1;min-width:0;border-top:3px solid #e5e7eb;padding-top:6px;white-space:nowrap;overflow:hidden}
  .r-steps span.done{border-top-color:var(--success);color:#374151}
  .r-steps span.on{border-top-color:var(--brand);color:#111827;font-weight:600}
  .r-progress{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden}
  .r-progress>i{display:block;height:100%;background:var(--brand)}
  .r-check,.r-radio{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-ctl);line-height:1.45;color:#374151}
  .r-check::before,.r-radio::before{content:"";flex:0 0 auto;width:20px;height:20px;border:1.5px solid #6b7280;background:#ffffff}
  .r-check::before{border-radius:5px}
  .r-radio::before{border-radius:50%}
  .r-check.on::before{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px #ffffff}
  .r-radio.on::before{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px #ffffff}
  .r-chips{display:flex;flex-wrap:wrap;gap:8px}
  .r-chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid #d1d5db;border-radius:999px;
          background:#ffffff;font-size:var(--fs-ctl);color:#374151;white-space:nowrap}
  .r-chip.on{border-color:var(--brand);color:var(--brand);font-weight:600}
  .r-search{position:relative;display:flex;align-items:center;min-height:var(--tap);padding:0 16px 0 42px;border:1px solid #d1d5db;
            border-radius:999px;background:#ffffff;font-size:var(--fs);color:#6b7280}
  .r-search::before{content:"";position:absolute;left:16px;top:50%;width:11px;height:11px;margin-top:-8px;border:2px solid #6b7280;
      border-radius:50%}
  .r-search::after{content:"";position:absolute;left:27px;top:50%;width:6px;height:2px;margin-top:5px;background:#6b7280;
      transform:rotate(45deg)}
  .r-suggest{display:flex;flex-direction:column;margin-top:-8px;border:1px solid #e5e7eb;border-radius:12px;background:#ffffff;
             box-shadow:0 8px 20px rgba(17,24,39,.08)}
  .r-suggest>*{font-size:var(--fs-ctl);color:#374151;padding:11px 16px;border-top:1px solid #f3f4f6}
  .r-suggest>*:first-child{border-top:0}
  .r-overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px;
             background:rgba(17,24,39,.5)}
  .r-modal{width:100%;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;background:#ffffff;
           box-shadow:0 16px 40px rgba(17,24,39,.25)}
  .r-banner{background:var(--brand);color:var(--on-brand);font-size:var(--fs-sm);font-weight:600;padding:10px 12px;border-radius:10px}
  .r-badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#f0fdf4;color:var(--success);font-size:12px;
           font-weight:600;line-height:1.2}
  .r-badge.warn{background:#fffbeb;color:var(--warning)}
  .r-badge.brand{background:var(--brand);color:var(--on-brand)}
  .r-stars{font-size:var(--fs-sm);color:var(--warning);letter-spacing:1px}
  .r-divider{height:1px;background:#e5e7eb}
{{BRAND_CSS}}
</style>
</head>
<body>
<div class="card" data-device="{{DEVICE}}" data-note-pos="{{NOTE_POS}}" data-phone-scale="{{PHONE_SCALE}}">
  <!-- Bu yorum yalnızca şablonu okuyan için; build_card.py teslim edilen karttan siler.

       KARTI ELLE DOLDURMA. Senaryo tek bir JSON kaydıdır (templates/scenario.schema.json);
       scripts/build_card.py yerleştiricileri doldurur, başlığı kaçırır, cihaz çerçevesini seçer.
       Kart karşılaştırmanın kendisidir: üstte kaydın başlığı (soru), altında iki sütun; her sütunda
       "Variant A" / "Variant B" hapı ve cihaz çerçevesi. Kaydın başka hiçbir metni karta yazılmaz.

       KART  1600 × 900 sabit, iç boşluk 40px 48px. Başlık en fazla 2 satır. Sütun genişliği 728px,
             sütunlar arası 48px; çerçeveler ortalanır ve ÜSTTEN hizalanır (A ile B aynı y'de başlar).
       ÇERÇEVELER  (yükseklik = içerik; en fazla sahne yüksekliği, taşan içerik kesilir ve
                    render_check.mjs bunu hata sayar: ekranın ilgili kısmını çizin)
         device: phone      → 420px telefon + durum çubuğu; sekme çubuğu YALNIZCA card.bottom_nav ile
                              (yerel uygulama), içeriğin hemen altında; etkin sekme card.bottom_nav_active
         device: phone-web  → aynı telefon + mobil adres çubuğu (kilit + card.url'deki alan adı), sekme çubuğu yok;
                              card.mobile_toolbar: true → ekranın altında tarayıcı araç çubuğu ve ev çizgisi (iki kolda aynı)
         device: web        → sütunu dolduran tarayıcı (üç nokta + adres çubuğu, card.url)
         card.url  kullanıcının verdiği adres aynen; adres verilmemiş, tarif edilen sayfa için temsilî
                   <ad>.example (ör. magaza.example/sepet)
         card.phone_scale  1 (uzun ekran), 1.2 (varsayılan), 1.4 (kısa ekran sahneyi doldursun)
       ÖLÇÜ  telefonda taban 15px, web'de 14px; başlık 18-19px; yardım/meta 13px; 12px altı yok;
             telefonda buton (.r-cta) ve alan (.r-field) en az 44px.

       DEĞİŞEN ÖĞE (.hl) ve card.difference:
         change → halka B'de (A'da isteğe bağlı)      add    → halka yalnızca B'deki yeni öğede
         move   → halka hem A'da hem B'de             remove → halka yalnızca A'da ("kaldırıldı" gibi bir
                                                               etiketle), B'de o alan gerçekten boş
       Aynı değişiklik tekrarlanan N öğeye uygulanıyorsa N halka değil, grubun etrafına TEK halka:
         <div class="hl" data-note="Butonlar dolu"> …altı kart… </div>
       Değişkenin bağlı sonucu (ör. değişen toplam) kendi kesikli, sönük halkasını alır; halka sayılmaz:
         <div class="hl-soft" data-note="Toplam güncellenir"><div class="r-line total">…</div></div>
         yalnızca kartta bir .hl varken, kol başına en fazla 2, halkanın içinde ya da etrafında değil;
         içindeki sayı farkı yine numeric_change ister.
       Etiket (data-note, 2-4 kelime) halkanın sağ üst köşesinin dışına oturur; bir öğeyi örtüyorsa
       data-pos="below" (tek halka) ya da card.note_pos: "below" (tüm kart).
       NEFES PAYI: halka çevresindeki öğeleri örtmez (halka öğenin 7px dışına çizilir); etiket
       halkanın üstünde ~31px yer ister. Ekranın üst kenarındaki bir öğenin etiketi alta alınır.

       BİLEŞENLER (yalnızca CSS; işaretleme örnekleri):
         Başlık çubuğu   <div class="r-header"><span class="r-logo">Marka</span><span class="r-nav"><span>Ürünler</span><span>Kampanyalar</span></span><span class="r-tel">0850 000 00 00</span></div>
                         .r-header.filled marka renginde dolu; boş <span class="r-logo"></span> card.brand.name'i yazar
         Sekmeler        <div class="r-tabs"><span class="on">Kredi</span><span>Mevduat</span></div>
         Alan            <div class="r-label">Ad Soyad</div><div class="r-field empty">Adınızı yazın</div>
         Açılır liste    <div class="r-field select">30-65</div>
         Yan yana alan   <div class="r-row"><div>…</div><div>…</div></div>
         Butonlar        .r-cta (dolu, marka rengi) · .r-cta.outline (çerçeveli) · .r-cta.ghost (siyah çerçeve) · .sm (küçük)
         Ürün ızgarası   <div class="r-grid c3"><div class="r-tile"><div class="r-name">Kasko</div><div class="r-meta">…</div><div class="r-cta sm outline">Teklif al</div></div>…</div>
         Plan kartı      <div class="r-plan featured"><div class="r-plan-name">Pro</div><div class="r-plan-price">499 TL<span class="r-per">/ay</span></div><ul class="r-plan-feat"><li>…</li></ul></div>
         Adımlar         <div class="r-steps"><span class="done">Araç</span><span class="on">Kişi</span><span>Teklif</span></div> · <div class="r-progress"><i style="width:40%"></i></div>
         Onay kutusu     <div class="r-check on">…</div> · Seçim düğmesi <div class="r-radio">…</div>
         Bilgi satırı    <div class="r-info">…</div> · Yardım satırı <div class="r-help">…</div>
         Çipler          <div class="r-chips"><span class="r-chip on">3 gün</span><span class="r-chip">1 hafta</span></div>
         Açılır pencere  <div class="r-overlay"><div class="r-modal">…</div></div> (ekranın üstünü kaplar)
         Arama           <div class="r-search">Nereye gidiyorsun?</div><div class="r-suggest"><div>Antalya</div><div>İzmir</div></div>
         Fotoğraflı hero <div class="ph hero"><div class="r-h">Başlık</div><div class="r-sub">…</div></div> (koyu zemin, beyaz metin)
         Görsel yeri     <div class="ph img"></div> (150px; yüksekliği style="height:…" ile değişir)
         Kampanya şeridi <div class="r-banner">4 taksit imkânı</div> (marka renginde dolu şerit)
         Rozet, fiyat    .r-badge (.warn, .brand) · <span class="r-old">1.200 TL</span><span class="r-now">990 TL</span><span class="r-per">/ay</span>
         Kalemler        .r-item/.r-thumb/.r-item-body/.r-name/.r-meta/.r-price · .r-line, .r-line.total · .r-card · .r-divider · .r-stars · .r-link · .r-h · .r-sub

       ÇERÇEVE İŞARETLERİ (phone, phone-web; ekranın doğrudan çocuğu, yalın yazılır, iki kolda aynı yerde):
         İlk ekran       <div class="r-fold"></div>: öncesi telefonda ilk ekran, sonrası telefonun altında
                         "Kaydırınca görünen kısım" yaprağı. Bir kolda varsa iki kolda da.
         Sabit bar       <div class="r-sticky"><div class="hl" data-note="Ekranın altında sabit"><div class="r-cta">Ödemeye geç</div></div></div>
                         ilk ekranın alt kenarına sabit; yalnızca .r-fold'dan önce, içinde tek öğe. Sabit
                         (yapışkan) bir öğe sayfa akışına gri bar olarak çizilmez, hep böyle çizilir.
                         Sabitleme testi bir taşımadır: A butonu devam yaprağında, B bu barda halkalar.
         Aşamalar        <div class="r-stage-break"></div> ekranı iki aşamaya böler (sonraki adım, açılan
                         ekran); card.stage_captions her aşamanın kısa başlığı, ör. ["Sepet", "Ödeme"].
                         Her aşama kendi küçük telefonunda, soldan sağa, arada →.

       İŞARETLEME İZİN LİSTESİYLE SINIRLIDIR; build_card.py listede olmayanı temizlemez, kartı reddeder:
         etiketler  div span p b strong i em u s small sup sub br hr ul ol li
         nitelikler class style data-note data-pos title role aria-*  (her değer çift tırnak içinde)
         yok        yorum, bağlantı (href), görsel/kaynak (src), form, betik, olay işleyici (on…=), style içinde url(), dış stil içe aktarma, position:fixed
         .hl sarmalayıcısı satır içi margin ya da padding taşımaz (halka içeriği itmez); r-… sınıfları yalnızca burada tanımlı olanlardır.

       İÇERİK GERÇEK YAZILIR (mockup-style.md → Realism level). Alanlara girilmiş kişisel veri
       (ad, e-posta, telefon, kimlik/kart numarası) asla taşınmaz; alan boş varsayılan hâliyle çizilir. -->
  <h1 class="title">{{TITLE}}</h1>
  <div class="stage">
    <div class="variant">
      <span class="pill pill-a">Variant A</span>
      <div class="phone">
        <div class="statusbar"><span>12:41</span><span class="sb-icons"><span class="sig"></span><span class="batt"></span></span></div>
        <div class="screen">
          {{VARIANT_A_SCREEN}}
        </div>
        <div class="bottomnav"><span>Anasayfa</span><span>Keşfet</span><span>Favoriler</span><span>Sepet</span><span>Profil</span></div>
      </div>
    </div>
    <div class="variant">
      <span class="pill pill-b">Variant B</span>
      <div class="phone">
        <div class="statusbar"><span>12:41</span><span class="sb-icons"><span class="sig"></span><span class="batt"></span></span></div>
        <div class="screen">
          {{VARIANT_B_SCREEN}}
        </div>
        <div class="bottomnav"><span>Anasayfa</span><span>Keşfet</span><span>Favoriler</span><span>Sepet</span><span>Profil</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
